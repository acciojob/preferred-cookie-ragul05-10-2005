<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customizable Font</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Preferred Cookie: Customizable Font</h1>
  
  <form id="font-form">
    <label for="fontsize">Font Size (8–72):</label>
    <input type="number" id="fontsize" name="fontsize" min="8" max="72" value="16">
    
    <label for="fontcolor">Font Color:</label>
    <input type="color" id="fontcolor" name="fontcolor" value="#000000">
    
    <input type="submit" value="Save">
  </form>

  <p>
    This is sample text. Adjust the font size and color using the form above, then click "Save".
    Your preferences will be remembered using cookies.
  </p>

  <script src="script.js"></script>
</body>
</html>
